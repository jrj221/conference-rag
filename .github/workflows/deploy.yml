name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Only PUBLIC values (project URL + publishable key) go into the browser bundle.
      - name: Create frontend env from config.public.json
        run: |
          echo "VITE_SUPABASE_URL=$(jq -r .SUPABASE_URL config.public.json)" > frontend/.env.production
          echo "VITE_SUPABASE_ANON_KEY=$(jq -r .SUPABASE_ANON_KEY config.public.json)" >> frontend/.env.production

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
